name: Validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: python -m pip install -r tools/scanner/scanner-requirements.txt
      - run: npm run test:data-pipeline
      - run: python -m unittest -v tools/scanner/test_talent_scanner.py
